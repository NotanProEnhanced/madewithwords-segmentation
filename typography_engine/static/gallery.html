<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="/static/favicons/typortrait/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/typortrait/favicon-32.png" />
<link rel="apple-touch-icon" href="/static/favicons/typortrait/apple-touch-icon.png" />
<link rel="icon" href="/static/favicons/typortrait/favicon.ico" sizes="any" />
<title>The Typortrait Gallery</title>
<style>
  :root{ --paper:#faf8f3; --card:#fff; --ink:#2d261f; --muted:#7c7468; --navy:#2f3b52;
         --line:#e8e2d6; --rose:#b07a2f; --gold:#b07a2f; --radius:16px;
         --shadow:0 14px 40px rgba(30,28,22,.10);
         --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
         --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto;padding:34px 20px 80px}
  header{text-align:center;margin-bottom:8px}
  h1{font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:-.02em;margin:0 0 6px}
  .lead{color:var(--muted);font-size:15.5px;max-width:600px;margin:0 auto 4px}
  /* top tabs (collections) */
  .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:26px 0 6px}
  .tab{border:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 18px;border-radius:999px;
       font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;transition:.15s}
  .tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .colblurb{text-align:center;color:var(--muted);font-size:14px;margin:10px auto 2px;max-width:620px;font-style:italic}
  /* sub-tabs (sections) */
  .subtabs{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px;border-bottom:1px solid var(--line);padding-bottom:0}
  .subtab{background:none;border:none;border-bottom:2.5px solid transparent;color:var(--muted);padding:9px 4px 11px;
          font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .subtab.on{color:var(--navy);border-bottom-color:var(--gold)}
  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;margin-top:26px}
  .item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
        border:1px solid var(--line);transition:transform .15s, box-shadow .15s}
  .item:hover{transform:translateY(-3px);box-shadow:0 20px 48px rgba(30,28,22,.16)}
  .item img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#eee}
  .item .meta{padding:12px 14px 15px}
  .item .t{font-family:var(--serif);font-size:18px;color:var(--ink);margin:0 0 3px}
  .item .w{color:var(--muted);font-size:12.5px;line-height:1.35;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* detail modal */
  .scrim{position:fixed;inset:0;background:rgba(28,24,18,.55);display:none;align-items:center;justify-content:center;
         padding:20px;z-index:50}
  .scrim.on{display:flex}
  .modal{background:#fff;border-radius:18px;max-width:860px;width:100%;max-height:92vh;overflow:auto;
         display:grid;grid-template-columns:1fr 1fr;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .modal img{width:100%;height:100%;object-fit:cover;background:#eee}
  .mbody{padding:26px 26px 24px}
  .mbody h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 6px}
  .mwords{color:var(--ink);font-size:14.5px;margin:0 0 14px}
  .prov{background:#f7f4ee;border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--muted);margin:0 0 18px}
  .prov b{color:var(--navy)}
  .price{font-family:var(--serif);font-size:24px;color:var(--navy);margin:2px 0 2px}
  .pnote{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .buy{display:block;width:100%;border:none;border-radius:12px;background:var(--navy);color:#fff;
       padding:14px;font-weight:800;font-size:15.5px;cursor:pointer;font-family:inherit}
  .buy:disabled{opacity:.55;cursor:default}
  .prints{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .prints h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px}
  .prow{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:13.5px;
        padding:9px 11px;margin:5px 0;color:var(--ink);background:#faf8f3;border:1px solid var(--line);
        border-radius:10px;cursor:pointer;font-family:inherit;text-align:left;transition:.12s}
  .prow:hover{border-color:var(--navy);background:#fff}
  .prow:disabled{opacity:.55;cursor:default}
  .prow b{color:var(--navy);font-weight:700}
  .soon{font-size:12px;color:var(--muted);font-style:italic;margin-top:8px}
  .close{position:absolute;top:18px;right:22px;background:#fff;border:1px solid var(--line);border-radius:999px;
         width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--navy);z-index:2}
  .err{color:#9c3535;font-size:13px;margin-top:10px;text-align:center;min-height:16px}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:46px}
  .foot a{color:var(--navy)}
  @media(max-width:680px){ .modal{grid-template-columns:1fr} .modal img{aspect-ratio:4/5} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="brandTitle">The Typortrait Gallery</h1>
    <p class="lead" id="brandLead">Sacred figures and beloved moments, each portrait woven entirely from the words that belong to it.</p>
    <input id="search" placeholder="Search the collection…" autocomplete="off"
      style="width:100%;max-width:440px;margin:14px auto 0;display:block;padding:11px 16px;border:1px solid #d9d2c4;border-radius:999px;font:inherit;background:#fff;color:#2a2620" />
  </header>

  <div class="tabs" id="tabs"></div>
  <p class="colblurb" id="colblurb"></p>
  <div class="subtabs" id="subtabs"></div>
  <div class="grid" id="grid"></div>

  <p class="foot"><span id="footNote">Every piece is rendered from public-domain scripture and verse.</span><span id="toolLink"> &nbsp;·&nbsp;
     <a href="/static/index.html">Make your own from a photo →</a></span></p>
</div>

<div class="scrim" id="scrim">
  <div class="modal" id="modal">
    <button class="close" id="close" aria-label="Close">×</button>
    <img id="mimg" alt="" />
    <div class="mbody">
      <h2 id="mtitle"></h2>
      <p class="mwords" id="mwords"></p>
      <div class="prov" id="mprov"></div>
      <div class="price" id="mprice">$14.99</div>
      <p class="pnote">High-resolution PNG, no watermark — print it anywhere.</p>
      <button class="buy" id="buy">Buy the digital download</button>
      <div class="err" id="err"></div>
      <div class="prints" id="prints"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let CAT=null, PRODUCTS=null, DIGITAL_CENTS=1499, curCol=0, curSec=0, curItem=null, SEARCH="";

// Gallery brand skins. Same storefront, different front: name, tagline, theme, and
// whether the generator ("make your own from a photo") is surfaced. A gallery-only
// brand (faithinwords) hides the tool -- it's a pure pre-made sales site, so the
// render engine is never exposed. Selected by ?brand= (local) or hostname (prod).
const BRANDS = {
  typortrait: {
    title: "The Typortrait Gallery",
    lead: "Sacred figures and beloved moments, each portrait woven entirely from the words that belong to it.",
    showTool: true, theme: null,
  },
  faithinwords: {
    title: "Faith in Words",
    lead: "Sacred art woven from scripture — the Savior, His Mother, and the saints, each portrait made from the very words that belong to them.",
    foot: "Every piece is rendered from public-domain scripture and verse.",
    showTool: false,
    theme: { "--navy":"#2f2b57", "--gold":"#b0863a", "--rose":"#b0863a",
             "--paper":"#f6f3ee", "--line":"#e6ded0" },
  },
};
function currentBrand(){
  const q=(new URLSearchParams(location.search).get("brand")||"").toLowerCase();
  if(q && BRANDS[q]) return q;                       // ?brand= wins (local testing)
  if(location.hostname.toLowerCase().includes("faithinwords")) return "faithinwords";
  return "typortrait";
}
function applyBrand(){
  const b=BRANDS[currentBrand()]||BRANDS.typortrait;
  document.title=b.title;
  const t=$("#brandTitle"); if(t) t.textContent=b.title;
  const l=$("#brandLead");  if(l) l.textContent=b.lead;
  if(b.theme){ for(const k in b.theme) document.documentElement.style.setProperty(k,b.theme[k]); }
  const fn=$("#footNote"); if(fn && b.foot) fn.textContent=b.foot;
  const tl=$("#toolLink"); if(tl && b.showTool===false) tl.style.display="none";  // gate the generator
}

function money(c){ return "$"+(c/100).toFixed(2); }

async function init(){
  applyBrand();
  const [c,p] = await Promise.all([
    fetch("/static/gallery/catalog.json?v="+Date.now()).then(r=>r.json()),
    fetch("/products?gallery=1").then(r=>r.ok?r.json():null).catch(()=>null)
  ]);
  CAT=c; PRODUCTS=p;
  if(p && p.products){
    const dig = p.products.find(x=>x.sku==="digital");
    if(dig) DIGITAL_CENTS = dig.price_cents;
  }
  renderTabs();
}

function renderTabs(){
  const t=$("#tabs"); t.innerHTML="";
  CAT.collections.forEach((col,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(i===curCol?" on":""); b.textContent=col.title;
    b.onclick=()=>{ curCol=i; curSec=0; renderTabs(); }; t.appendChild(b);
  });
  const col=CAT.collections[curCol];
  $("#colblurb").textContent = col.blurb||"";
  const st=$("#subtabs"); st.innerHTML="";
  col.sections.forEach((sec,j)=>{
    const b=document.createElement("button");
    b.className="subtab"+(j===curSec?" on":""); b.textContent=sec.title;
    b.onclick=()=>{ curSec=j; renderTabs(); }; st.appendChild(b);
  });
  renderGrid();
}

function renderGrid(){
  const g=$("#grid"); g.innerHTML="";
  const col=CAT.collections[curCol];
  let items;
  if(SEARCH){
    // Search spans the whole collection (all sections); hide the sub-tabs.
    const q=SEARCH;
    items=col.sections.flatMap(s=>s.items).filter(it=>
      ((it.title||"")+" "+(it.words||"")).toLowerCase().includes(q));
    $("#subtabs").style.display="none";
  } else {
    items=(col.sections[curSec]||{items:[]}).items;
    $("#subtabs").style.display="";
  }
  if(!items.length){ g.innerHTML='<p style="grid-column:1/-1;color:#8a8172;text-align:center;padding:40px 0">No pieces match.</p>'; return; }
  items.forEach(it=>{
    // Each card is a real link to the item's own landing page — crawlable for
    // Google/Pinterest and the destination for referral traffic.
    const card=document.createElement("a"); card.className="item";
    card.href="/gallery/"+encodeURIComponent(it.id); card.style.textDecoration="none";
    card.innerHTML=`<img src="/static/gallery/art/${it.id}.png" alt="${it.title}" loading="lazy"/>
      <div class="meta"><p class="t">${it.title}</p><p class="w">${it.words}</p></div>`;
    g.appendChild(card);
  });
}
// item digital price in cents: per-item `price` (dollars) if set, else the default.
function itemCents(it){
  const p=parseFloat(it && it.price); return (isFinite(p)&&p>0)?Math.round(p*100):DIGITAL_CENTS;
}

function openItem(it){
  curItem=it;
  $("#mimg").src=`/static/gallery/art/${it.id}.png`;
  $("#mtitle").textContent=it.title;
  $("#mwords").textContent=it.words;
  $("#mprov").innerHTML=`<b>The words:</b> ${it.text}<br/><b>The art:</b> ${it.art}`;
  $("#mprice").textContent=money(itemCents(it));
  $("#err").textContent="";
  const buy=$("#buy"); buy.disabled=false; buy.textContent="Buy the digital download";
  // prints — buyable when fulfillment is configured
  const pr=$("#prints");
  if(PRODUCTS && PRODUCTS.products){
    const prints=PRODUCTS.products.filter(x=>x.physical && !x.memorial_only && !x.sizes.length);
    const live = PRODUCTS.fulfillment_configured;
    pr.innerHTML=`<h3>Order it as a print</h3>`+
      prints.map(x=>`<button class="prow" data-sku="${x.sku}" ${live?"":"disabled"}>
        <span>${x.name}<br><span style="color:var(--muted);font-size:11.5px">+ ${money(x.shipping_cents)} shipping</span></span>
        <b>${money(x.price_cents)}</b></button>`).join("")+
      (live?"":`<p class="soon">Prints arrive soon — the digital download is ready now.</p>`);
    pr.querySelectorAll(".prow").forEach(b=>{
      b.onclick=()=>startCheckout(curItem.id, b.dataset.sku, b);
    });
  } else { pr.innerHTML=""; }
  $("#scrim").classList.add("on");
}
function closeModal(){ $("#scrim").classList.remove("on"); }
$("#close").onclick=closeModal;
$("#scrim").onclick=e=>{ if(e.target===$("#scrim")) closeModal(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

async function startCheckout(itemId, sku, btn){
  const label = btn ? btn.innerHTML : "";
  if(btn){ btn.disabled=true; }
  const buy=$("#buy"); if(btn!==buy) buy.disabled=true;
  $("#err").textContent="";
  try{
    const fd=new FormData(); fd.append("item",itemId); fd.append("sku",sku);
    const r=await fetch("/gallery/checkout",{method:"POST",body:fd});
    const d=await r.json();
    if(d.ok && d.url){ window.location.href=d.url; return; }
    $("#err").textContent = ({
      payments_unconfigured:"Checkout isn’t set up in this environment yet.",
      fulfillment_unconfigured:"Prints aren’t available right now — try the digital download.",
      unsupported_product:"That print option isn’t available for this piece.",
      unknown_item:"This piece isn’t available right now.",
      art_missing:"This piece is coming soon — the artwork is still being finished."
    })[d.error] || "Couldn’t start checkout — please try again.";
  }catch(e){ $("#err").textContent="Couldn’t reach checkout — please try again."; }
  if(btn){ btn.disabled=false; if(label) btn.innerHTML=label; }
  buy.disabled=false; buy.textContent="Buy the digital download";
}
$("#buy").onclick=()=>{ if(curItem){ $("#buy").textContent="Opening secure checkout…"; startCheckout(curItem.id,"digital",$("#buy")); } };
$("#search").addEventListener("input", e=>{ SEARCH=e.target.value.trim().toLowerCase(); renderGrid(); });

init();
</script>
</body>
</html>
