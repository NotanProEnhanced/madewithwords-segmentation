<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/static/favicons/lovedinwords/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/lovedinwords/favicon-32.png" />
<link rel="apple-touch-icon" href="/static/favicons/lovedinwords/apple-touch-icon.png" />
<link rel="icon" href="/static/favicons/lovedinwords/favicon.ico" sizes="any" />
<title>Your gather</title>
<style>
  :root{ --paper:#faf8f3; --card:#fff; --ink:#2d261f; --muted:#7c7468; --navy:#2f3b52;
         --line:#ece7dd; --rose:#c85b57; --radius:18px; --shadow:0 18px 50px rgba(30,28,22,.10);
         --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
         --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:30px 20px 60px;overflow-x:clip}
  h1{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.02em;text-align:center;margin:0 0 4px}
  .sub{color:var(--muted);text-align:center;font-size:14px;margin:0 0 22px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .card img{display:block;width:100%;border-radius:10px;background:#f3efe8}
  .stat{display:flex;gap:18px;justify-content:center;margin:14px 0 0}
  .stat div{text-align:center}
  .stat b{display:block;font-size:24px;color:var(--navy);font-family:var(--serif)}
  .stat span{font-size:12px;color:var(--muted)}
  .h{font-weight:700;color:var(--navy);font-size:15px;margin:0 0 12px}
  .sharebox{display:flex;gap:8px}
  .sharebox input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:13px;background:#fcfbf8;color:var(--ink)}
  .sharebox button,.act{border:none;border-radius:10px;background:var(--navy);color:#fff;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .btn-row{display:flex;gap:10px;margin-top:14px}
  .act.ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy);flex:1}
  .act.primary{flex:1}
  .words{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto}
  .w{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line)}
  .w.hidden{opacity:.4}
  .w .t{font-size:14px}
  .w .t small{color:var(--muted);font-weight:400}
  .w .x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline}
  .note{color:var(--muted);font-size:12.5px;text-align:center;margin-top:10px}
  .ok{color:#2e7d52}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Your gather</h1>
  <p class="sub">You started this. Share it, watch it grow, then reveal it.</p>

  <div class="card">
    <img id="portrait" alt="the portrait so far" />
    <div class="stat">
      <div><b id="cWords">0</b><span>words</span></div>
      <div><b id="cPeople">0</b><span>people</span></div>
      <div><b id="cStatus">open</b><span>status</span></div>
    </div>
    <div class="btn-row">
      <button class="act ghost" id="refresh">Refresh portrait</button>
      <button class="act primary" id="reveal">Finish &amp; reveal</button>
    </div>
    <div class="note" id="revealNote"></div>
  </div>

  <div class="card">
    <p class="h">Invite the circle</p>
    <div class="sharebox">
      <input id="shareUrl" readonly />
      <button id="copy">Copy</button>
    </div>
    <p class="note">Send it in the family chat: <i>"Help us remember them — add a word."</i></p>
  </div>

  <div class="card">
    <p class="h">The words so far <span id="wcount" style="color:var(--muted);font-weight:400"></span></p>
    <div class="words" id="words"></div>
    <p class="note">Tap <b>hide</b> to keep a word out of the portrait. Hidden words aren't woven in.</p>
  </div>
</div>

<script>
const ADMIN = location.pathname.split("/").pop();
const $ = s => document.querySelector(s);

async function load(){
  const r = await fetch(`/api/gather/admin/${ADMIN}/state`);
  if(!r.ok){ document.body.innerHTML="<p style='text-align:center;padding:60px'>Gather not found.</p>"; return; }
  const s = await r.json();
  $("#title").textContent = `Gathering words for ${s.title}`;
  if(s.has_portrait) $("#portrait").src = s.portrait_url;
  $("#cWords").textContent = s.count;
  $("#cPeople").textContent = s.contributors;
  $("#cStatus").textContent = s.status;
  $("#shareUrl").value = s.share_url;
  $("#wcount").innerHTML = `(${s.words.length})` + (s.pending ? ` &middot; <span style="color:var(--rose)">composing…</span>` : "");
  if(s.status==="revealed"){ $("#reveal").textContent="Revealed ✓"; $("#reveal").disabled=true; }
  const box=$("#words"); box.innerHTML="";
  s.words.forEach(w=>{
    const row=document.createElement("div"); row.className="w"+(w.hidden?" hidden":"");
    row.innerHTML=`<span class="t">${esc(w.text)} ${w.name?`<small>— ${esc(w.name)}</small>`:""}</span>`;
    const x=document.createElement("button"); x.className="x"; x.textContent=w.hidden?"show":"hide";
    x.onclick=async()=>{ const fd=new FormData(); fd.append("hidden", w.hidden?0:1); await fetch(`/api/gather/admin/${ADMIN}/word/${w.id}/hide`,{method:"POST",body:fd}); load(); };
    row.appendChild(x); box.appendChild(row);
  });
}
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

$("#copy").onclick=()=>{ $("#shareUrl").select(); document.execCommand("copy"); $("#copy").textContent="Copied!"; setTimeout(()=>$("#copy").textContent="Copy",1500); };
$("#refresh").onclick=async()=>{ $("#refresh").textContent="Composing…"; await fetch(`/api/gather/admin/${ADMIN}/render`,{method:"POST"}); setTimeout(()=>{ $("#refresh").textContent="Refresh portrait"; load(); }, 4000); };
$("#reveal").onclick=async()=>{
  if(!confirm("Reveal the finished portrait? Contributors will be able to see it and order their own. You can still keep adding words.")) return;
  $("#reveal").textContent="Revealing…";
  await fetch(`/api/gather/admin/${ADMIN}/reveal`,{method:"POST"});
  $("#revealNote").innerHTML='<span class="ok">Revealed. Everyone who added a word can now see it and order a print.</span>';
  load();
};
load();
setInterval(load, 8000);
</script>
</body>
</html>
