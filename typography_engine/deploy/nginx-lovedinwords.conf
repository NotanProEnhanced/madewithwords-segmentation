# LovedInWords.com  ->  the LovedInWords container on 127.0.0.1:8080.
#
# The lovedinwords.com vhost ALREADY EXISTS with a Certbot cert and currently serves a
# static page from /var/www/lovedinwords.com. This replaces that static block with a
# reverse proxy to the container, KEEPING the existing Certbot SSL lines untouched.
#
# Install (back up first):
#   sudo cp /etc/nginx/sites-available/lovedinwords.com /etc/nginx/sites-available/lovedinwords.com.bak
#   sudo cp deploy/nginx-lovedinwords.conf /etc/nginx/sites-available/lovedinwords.com
#   sudo nginx -t && sudo systemctl reload nginx
# (Cert already exists, so no certbot run is needed.)
server {
    server_name lovedinwords.com www.lovedinwords.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lovedinwords.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lovedinwords.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.lovedinwords.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = lovedinwords.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    listen [::]:80;
    server_name lovedinwords.com www.lovedinwords.com;
    return 404; # managed by Certbot
}
