# ---------------------------------------------------------------------------
# Security response headers for all Typortrait-family sites.
# (typortrait / lovedinwords / faithinwords / staging)
#
# HOW TO APPLY (does NOT replace your existing, certbot-managed configs):
#
#   1. Copy this file to the nginx snippets dir:
#        sudo mkdir -p /etc/nginx/snippets
#        sudo cp deploy/security-headers.conf /etc/nginx/snippets/security-headers.conf
#
#   2. In EACH site's server block (the 443 one certbot created), add ONE line
#      inside `server { ... }`:
#        include /etc/nginx/snippets/security-headers.conf;
#      Files: /etc/nginx/sites-available/{typortrait.com,lovedinwords.com,faithinwords.com,...}
#
#   3. Hide the nginx version banner — add this once inside the `http { }` block
#      of /etc/nginx/nginx.conf (if not already present):
#        server_tokens off;
#
#   4. Validate and reload:
#        sudo nginx -t && sudo systemctl reload nginx
#
# NOTE on `add_header` inheritance: if a `location` block sets its OWN add_header,
# nginx drops all inherited ones inside that location. These directives use the
# `always` flag and, placed at server level, apply to the proxied app because the
# existing `location /` sets no add_header of its own. If you later add a location
# that sets add_header (e.g. a /static/ cache block, below), add this same
# `include` line inside it too.
# ---------------------------------------------------------------------------

# Force HTTPS for a year, including subdomains. Safe once every hostname you serve
# is on HTTPS (they are — http:// already 301s to https://). Do NOT add `preload`
# unless you intend to submit to the HSTS preload list (hard to undo).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Stop browsers MIME-sniffing a response into a different content type.
add_header X-Content-Type-Options "nosniff" always;

# Don't leak full referrer URLs (which can carry ?ref / session context) cross-site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disallow the site being framed by other origins (clickjacking).
add_header X-Frame-Options "SAMEORIGIN" always;

# Turn off browser features the sites don't use.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# ---------------------------------------------------------------------------
# OPTIONAL — Content-Security-Policy.
# A wrong CSP silently breaks pages (inline scripts/styles, Umami analytics,
# Stripe redirect, self-hosted fonts). Start in REPORT-ONLY mode: it enforces
# NOTHING, only logs violations to the browser console, so you can tune it safely.
# When the console is clean across the studio + gallery + checkout, rename the
# header to `Content-Security-Policy` to enforce. Uncomment to begin testing:
#
# add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'unsafe-inline' https://cloud.umami.is; connect-src 'self' https://cloud.umami.is; frame-src https://js.stripe.com https://checkout.stripe.com; form-action 'self' https://checkout.stripe.com; base-uri 'self'; frame-ancestors 'self'" always;

# ---------------------------------------------------------------------------
# OPTIONAL (P2) — cache static ASSETS (not HTML) so repeat visits are faster.
# Do NOT blanket-cache /static/ — index.html and gallery.html live there and must
# stay fresh after a `git pull` deploy. Scope caching to asset extensions instead.
# Add inside each server block:
#
# location ~* ^/static/.*\.(webp|png|jpg|jpeg|svg|ico|woff2?|css|js)$ {
#     proxy_pass http://127.0.0.1:PORT;   # 8077 typortrait / 8079 faithinwords / 8080 lovedinwords
#     proxy_set_header Host $host;
#     expires 30d;
#     add_header Cache-Control "public, max-age=2592000, immutable";
#     include /etc/nginx/snippets/security-headers.conf;
# }
