# FaithInWords.com  ->  the FaithInWords container on 127.0.0.1:8079.
# PUBLIC storefront (no Basic Auth). Install, then add TLS with certbot:
#   sudo cp deploy/nginx-faithinwords.conf /etc/nginx/sites-available/faithinwords.com
#   sudo ln -s /etc/nginx/sites-available/faithinwords.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d faithinwords.com -d www.faithinwords.com   # inserts the 443 block + HTTP->HTTPS redirect
#
# No geoip headers here on purpose: this is a pre-made gallery (no face upload), so the
# biometric-region gate the studio needs doesn't apply.
server {
    listen 80;
    listen [::]:80;
    server_name faithinwords.com www.faithinwords.com;

    client_max_body_size 25m;

    # The bare domain lands on the storefront, not the personalized studio.
    location = / { return 302 /gallery; }

    location / {
        proxy_pass http://127.0.0.1:8079;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
