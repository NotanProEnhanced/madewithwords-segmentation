# Two nginx vhosts on the VPS (both names resolve to the same box):
#   typortrait.com / www.typortrait.com  -> STATIC marketing site in /var/www/typortrait.com
#   app.typortrait.com                   -> the FastAPI studio app (uvicorn on 127.0.0.1:8077)
#
# Install to /etc/nginx/sites-available/typortrait.conf and symlink into
# sites-enabled. HTTP only here; `certbot --nginx` adds the 443 blocks + an
# HTTP->HTTPS redirect automatically (see DEPLOY.md step 4).

# --- Marketing landing page (static files, no app involved) ---
server {
    listen 80;
    listen [::]:80;
    server_name typortrait.com www.typortrait.com;

    root /var/www/typortrait.com;
    index index.html;

    # Old pre-split Typortrait versions used to be served from this docroot
    # (v4/app, v5, v6, notan, typographic, the old /typography-app + /generate +
    # /typographic-api API surfaces, and stage1-3). Those dirs/services have been
    # retired; 301 every leftover path to the canonical homepage so stale search
    # results and bookmarks consolidate there.
    # NOTE: certbot serves the live site from a 443 block — keep this same
    # location in that block (it is what actually answers https requests).
    location ~ ^/(v4|v5|v6|notan|typographic|typographic-api|typography-app|generate|typortrait-stage[123])(/|$) {
        return 301 https://typortrait.com/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# --- Studio app (FastAPI behind a reverse proxy) ---
server {
    listen 80;
    listen [::]:80;
    server_name app.typortrait.com;

    # Photo uploads.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Renders take a few seconds.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
