# Two nginx vhosts on the VPS (both names resolve to the same box):
#   typortrait.com / www.typortrait.com  -> STATIC marketing site in /var/www/typortrait.com
#   app.typortrait.com                   -> the FastAPI studio app (uvicorn on 127.0.0.1:8077)
#
# Install to /etc/nginx/sites-available/typortrait.conf and symlink into
# sites-enabled. HTTP only here; `certbot --nginx` adds the 443 blocks + an
# HTTP->HTTPS redirect automatically (see DEPLOY.md step 4).

# --- Marketing landing page (static files, no app involved) ---
server {
    listen 80;
    listen [::]:80;
    server_name typortrait.com www.typortrait.com;

    root /var/www/typortrait.com;
    index index.html;

    # The pre-split app used to live at /v4/app. 301 any leftover /v4 path to the
    # canonical homepage so stale Google results and old bookmarks land on the
    # current site (and Google consolidates the old URL into the canonical).
    # ^~ wins over try_files so it fires even if old /v4 files still exist on disk.
    # NOTE: certbot serves the live site from a 443 block — add these two lines
    # there too (that is the block actually answering https requests).
    location = /v4   { return 301 https://typortrait.com/; }
    location ^~ /v4/ { return 301 https://typortrait.com/; }

    location / {
        try_files $uri $uri/ =404;
    }
}

# --- Studio app (FastAPI behind a reverse proxy) ---
server {
    listen 80;
    listen [::]:80;
    server_name app.typortrait.com;

    # Photo uploads.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Renders take a few seconds.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
