# /etc/nginx/sites-available/typortrait.conf  (symlink into sites-enabled)
# HTTP only here; `certbot --nginx` adds the 443 block + redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name typortrait.com www.typortrait.com;

    # Photo uploads.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Renders take a few seconds.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
