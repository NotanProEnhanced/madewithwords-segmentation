# Staging mirror — staging.typortrait.com -> the staging container on :8078.
# PRIVATE (HTTP Basic Auth) + noindex, so only you can reach it and search
# engines never crawl/index a second copy of the app.
#
# One-time setup on the VPS:
#   1) DNS: add an A record  staging.typortrait.com -> <this server's IP>
#   2) Create the login (you choose the username + password):
#        sudo apt-get install -y apache2-utils
#        sudo htpasswd -c /etc/nginx/.htpasswd-staging <username>
#   3) Install + enable this vhost:
#        sudo cp deploy/nginx-staging.conf /etc/nginx/sites-available/staging.typortrait.com
#        sudo ln -s /etc/nginx/sites-available/staging.typortrait.com /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#   4) Add HTTPS (certbot inserts the 443 block + HTTP->HTTPS redirect):
#        sudo certbot --nginx -d staging.typortrait.com

server {
    listen 80;
    listen [::]:80;
    server_name staging.typortrait.com;

    client_max_body_size 25m;

    # Never let staging into a search index (belt-and-suspenders with Basic Auth).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Password-protect the whole mirror...
    auth_basic "Typortrait staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    # ...except the two machine-to-machine callbacks that cannot send a password:
    #   - Stripe POSTs webhooks here (no Basic Auth support).
    #   - Printful fetches the HMAC-signed, time-limited art URL here.
    # Both are independently authenticated (Stripe signature / signed URL), so
    # exempting them from Basic Auth is safe.
    location = /webhook/stripe {
        auth_basic off;
        proxy_pass http://127.0.0.1:8078;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /printful-fetch/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8078;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8078;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
