# PawsInWords.com  ->  the PawsInWords (pet) container on 127.0.0.1:8081.
#
# FRESH domain: unlike the other brands there is NO existing Certbot cert yet, so this file is
# the HTTP-only vhost that Certbot attaches to; `certbot --nginx` then injects the 443 ssl block
# and the 80->443 redirect automatically (leaving this file looking like nginx-lovedinwords.conf).
#
# Prereqs:
#   * DNS A records for pawsinwords.com AND www.pawsinwords.com -> the server IP (74.208.113.203),
#     resolving BEFORE you run certbot (check: `dig +short pawsinwords.com`).
#   * The pawsinwords container running on 127.0.0.1:8081 (./pawsinwords.sh up -d --build).
#
# Install:
#   sudo cp deploy/nginx-pawsinwords.conf /etc/nginx/sites-available/pawsinwords.com
#   sudo ln -s /etc/nginx/sites-available/pawsinwords.com /etc/nginx/sites-enabled/pawsinwords.com
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pawsinwords.com -d www.pawsinwords.com   # obtains the cert + adds TLS
server {
    listen 80;
    listen [::]:80;
    server_name pawsinwords.com www.pawsinwords.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
