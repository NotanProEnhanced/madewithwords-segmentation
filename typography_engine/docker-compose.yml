# Typortrait — runs the engine on 127.0.0.1:8077 (nginx terminates TLS in front).
# Reads payment settings from a .env file in this directory (see GO-LIVE.md).
services:
  typortrait:
    build: .
    image: typortrait:latest
    container_name: typortrait
    restart: unless-stopped
    ports:
      - "127.0.0.1:8077:8077"
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - TYPO_PRICE_CENTS=${TYPO_PRICE_CENTS:-900}
      - TYPO_CURRENCY=${TYPO_CURRENCY:-usd}
      - TYPO_PUBLIC_URL=${TYPO_PUBLIC_URL:-https://app.typortrait.com}
      # Phase C: admin review dashboard + email notifications. See DEPLOY.md
      # for the Gmail app-password setup; SMTP creds are optional (the
      # dashboard still works without them — you just won't get notification
      # emails).
      - TYPO_ADMIN_PASSWORD=${TYPO_ADMIN_PASSWORD:-}
      - TYPO_ADMIN_EMAIL=${TYPO_ADMIN_EMAIL:-}
      - TYPO_SECRET_KEY=${TYPO_SECRET_KEY:-}
      - TYPO_SMTP_HOST=${TYPO_SMTP_HOST:-smtp.gmail.com}
      - TYPO_SMTP_PORT=${TYPO_SMTP_PORT:-587}
      - TYPO_SMTP_USER=${TYPO_SMTP_USER:-}
      - TYPO_SMTP_PASS=${TYPO_SMTP_PASS:-}
      # Print-on-demand (Printful). All optional: with no PRINTFUL_API_TOKEN the
      # storefront stays digital-only and physical checkout is gated off. The
      # webhook secret lets the async order pipeline verify Stripe callbacks; the
      # print-URL secret signs the time-limited art URLs Printful fetches (it
      # falls back to the webhook secret if unset).
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - PRINTFUL_API_TOKEN=${PRINTFUL_API_TOKEN:-}
      - PRINTFUL_STORE_ID=${PRINTFUL_STORE_ID:-}
      - PRINTFUL_API_BASE=${PRINTFUL_API_BASE:-https://api.printful.com}
      - PRINT_URL_SECRET=${PRINT_URL_SECRET:-}
      # Auto-confirm paid physical orders at Printful. Defaults to true (real
      # fulfillment). Set PRINTFUL_CONFIRM=false while testing so orders land
      # as deletable drafts (no charge, no print). See GO-LIVE.md.
      - PRINTFUL_CONFIRM=${PRINTFUL_CONFIRM:-true}
    volumes:
      # Persist previews + paid clean files across restarts/rebuilds.
      - ./data/outputs:/app/outputs
      - ./data/private:/app/private
      # Persist the orders SQLite DB (print-on-demand order lifecycle) so it
      # survives `docker compose up --build`. Lives at /app/data/orders.db.
      - ./data:/app/data
      # Serve the front-end straight from the working tree so static tweaks go
      # live on `git pull` (no image rebuild needed). Read-only: the app only
      # reads these files.
      - ./static:/app/static:ro
