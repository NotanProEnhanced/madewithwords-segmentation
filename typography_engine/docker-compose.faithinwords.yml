# FaithInWords.com storefront — a COMPLETE, standalone compose file (not an override),
# so it never inherits/merges prod's port and can't collide. Run it from a SEPARATE
# working tree checked out to this branch (e.g. ~/typortrait-faithinwords), via the
# faithinwords.sh helper:
#
#   ./faithinwords.sh up -d --build     # build + start
#   ./faithinwords.sh ps                # status
#   ./faithinwords.sh logs -f           # tail logs
#   ./faithinwords.sh down              # stop
#
# (faithinwords.sh wraps: docker compose -f docker-compose.faithinwords.yml -p typortrait-faithinwords <args>)
#
# Isolation vs prod AND staging:
#   * image typortrait-faithinwords:latest -> never overwrites another image
#   * container typortrait-faithinwords     -> no name clash
#   * port 127.0.0.1:8079                    -> prod 8077, staging 8078
#   * bind-mounts resolve inside THIS tree   -> its OWN data/orders/purchase ledger
#   * secrets come from THIS tree's .env (copy from .env.faithinwords.example)
# This is a PUBLIC storefront (no Basic Auth); nginx terminates TLS + proxies here.
name: typortrait-faithinwords
services:
  typortrait:
    build: .
    image: typortrait-faithinwords:latest
    container_name: typortrait-faithinwords
    restart: unless-stopped
    ports:
      - "127.0.0.1:8079:8077"
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - TYPO_PRICE_CENTS=${TYPO_PRICE_CENTS:-1499}
      - TYPO_CURRENCY=${TYPO_CURRENCY:-usd}
      - TYPO_PUBLIC_URL=${TYPO_PUBLIC_URL:-https://faithinwords.com}
      - TYPO_ADMIN_PASSWORD=${TYPO_ADMIN_PASSWORD:-}
      - TYPO_ADMIN_EMAIL=${TYPO_ADMIN_EMAIL:-}
      - TYPO_SECRET_KEY=${TYPO_SECRET_KEY:-}
      - TYPO_SMTP_HOST=${TYPO_SMTP_HOST:-smtp.gmail.com}
      - TYPO_SMTP_PORT=${TYPO_SMTP_PORT:-587}
      - TYPO_SMTP_USER=${TYPO_SMTP_USER:-}
      - TYPO_SMTP_PASS=${TYPO_SMTP_PASS:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - PRINTFUL_API_TOKEN=${PRINTFUL_API_TOKEN:-}
      - PRINTFUL_STORE_ID=${PRINTFUL_STORE_ID:-}
      - PRINTFUL_API_BASE=${PRINTFUL_API_BASE:-https://api.printful.com}
      - PRINT_URL_SECRET=${PRINT_URL_SECRET:-}
      # Starts as DRAFTS (safe). Set PRINTFUL_CONFIRM=true in .env to fulfil real prints.
      - PRINTFUL_CONFIRM=${PRINTFUL_CONFIRM:-false}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - UMAMI_HOST=${UMAMI_HOST:-https://cloud.umami.is}
      - UMAMI_HOSTNAME=${UMAMI_HOSTNAME:-faithinwords.com}
      - TYPO_BLOCKED_REGIONS=${TYPO_BLOCKED_REGIONS:-US-IL}
      - TYPO_GEO_COUNTRY_HEADER=${TYPO_GEO_COUNTRY_HEADER:-X-Geo-Country}
      - TYPO_GEO_REGION_HEADER=${TYPO_GEO_REGION_HEADER:-X-Geo-Region}
      - TYPO_BIO_CONSENT_VERSION=${TYPO_BIO_CONSENT_VERSION:-bio-v1-2026-06}
      # This container IS the gallery storefront, so the gallery defaults ON here.
      - TYPO_GALLERY_ENABLED=${TYPO_GALLERY_ENABLED:-1}
      # Gather + redemption are not part of this storefront; default OFF.
      - TYPO_GATHER_ENABLED=${TYPO_GATHER_ENABLED:-}
      - TYPO_REDEEM_ENABLED=${TYPO_REDEEM_ENABLED:-}
      - TYPO_REDEEM_BRAND=${TYPO_REDEEM_BRAND:-}
      - TYPO_WORD_VARIETY=${TYPO_WORD_VARIETY:-}
      - TYPO_RETENTION_DAYS=${TYPO_RETENTION_DAYS:-30}
      - TYPO_CONSENT_RETENTION_DAYS=${TYPO_CONSENT_RETENTION_DAYS:-}
      - TYPO_ENABLE_DEBUG=${TYPO_ENABLE_DEBUG:-}
      - TYPO_REQUIRE_CAIROSVG=${TYPO_REQUIRE_CAIROSVG:-}
      # Background lightening: image background lighter than the subject's dark
      # ground (0..1 toward white; 0 = off, background == ground).
      - TYPO_BG_LIGHTEN=${TYPO_BG_LIGHTEN:-0}
      # Highlight wash: keep bright features (silver hair, pale skin) light on the dark
      # ground so they don't collapse to the ground (0..1; 0 disables). Default 0.5.
      - TYPO_HILIGHT_WASH=${TYPO_HILIGHT_WASH:-0.5}
      # Shadow lift: preserve modelled detail in a face's shaded side instead of crushing
      # it to the near-black ground (0..1; 0 disables). Default 0.18.
      - TYPO_SHADOW_LIFT=${TYPO_SHADOW_LIFT:-0.18}
      # Colour fidelity (step 3): vibrance strength, oversaturation ceiling (HSV S; 0 off),
      # and word-ink saturation multiplier. Lower vibrance / cap => less orange skin,
      # less magenta lips. Defaults tuned for natural skin.
      - TYPO_VIBRANCE=${TYPO_VIBRANCE:-0.22}
      - TYPO_SAT_CAP=${TYPO_SAT_CAP:-150}
      # Photographic eye-overlay opacity (0..1). Lower blends the typography through the eye
      # so it reads as part of the words. Default 0.5.
      - TYPO_EYE_PHOTO=${TYPO_EYE_PHOTO:-1.0}
      # Eye crispness: sharpen + local contrast inside the eye (scaled up for small/distant
      # eyes) so non-closeup sources don't render flat/muddy eyes. 0 disables.
      - TYPO_EYE_SHARPEN=${TYPO_EYE_SHARPEN:-0.6}
      # Eye pop: paint a crisp catchlight + dark iris rim ON TOP of the photo eye so soft/
      # low-res sources still read alive and defined (not flat/muddy). Scaled up for small eyes.
      - TYPO_EYE_POP=${TYPO_EYE_POP:-0.8}
      # Face-detail sizing: lift text density across the whole face so the chin, cheekbones
      # and ears render as FINE type -- distinct from the larger neck below. 0 reverts.
      - TYPO_FACE_DETAIL=${TYPO_FACE_DETAIL:-0.95}
      # Light-aware far-edge softening: on a directionally-lit subject, fade the SHADOW-side
      # silhouette edge into the ground (self-gates -- flat lighting = no effect). 0 disables.
      - TYPO_EDGE_FALLOFF=${TYPO_EDGE_FALLOFF:-0.45}
      # Lifelike Mosaic/Passage: render the Words (Mosaic) + Message (Passage) styles on
      # Original ink through the Lifelike (displacement) engine, so all three styles share
      # Lifelike's photographic quality and differ only in TYPOGRAPHY -- Lifelike = weighted
      # words, Mosaic = a varied word-cloud, Passage = the message in written order.
      # OFF until validated on staging; flip to 1 (or set in .env).
      - TYPO_LAYERED_PHOTO=${TYPO_LAYERED_PHOTO:-0}
      # Paper/ink ground floors so faces + light hair read on ivory (0..1; 0 off).
      - TYPO_PAPER_FACE=${TYPO_PAPER_FACE:-0.30}
      - TYPO_PAPER_HAIR=${TYPO_PAPER_HAIR:-0.35}
      # Lifelike polarity + word-formed eyes. OFF here (byte-identical) until validated on
      # staging; flip to 1 (or set in .env) when promoting the new Lifelike look.
      - TYPO_POLARITY=${TYPO_POLARITY:-0}
      - TYPO_WORD_EYES=${TYPO_WORD_EYES:-0}
      # Sunglasses backstop: suppress fabricated eyes on dark lenses (auto). =0 reverts.
      - TYPO_DARKSCLERA=${TYPO_DARKSCLERA:-1}
      - TYPO_LENS_DARKRATIO=${TYPO_LENS_DARKRATIO:-0.62}
      # Misfit-mesh guard: suppress a face whose iris sits above its brow by this
      # fraction of face height (sunglasses/occluded meshes slide onto the forehead).
      - TYPO_MISFIT_GAP=${TYPO_MISFIT_GAP:-0.02}
      # Sunglasses toggle: with the flag on, only faces darker than this (p90) get an opaque lens
      # -- so a mixed group (sunglasses + clear/prescription glasses) doesn't black out real eyes.
      - TYPO_LENS_DARK_MAX=${TYPO_LENS_DARK_MAX:-115}
      # Soft hair matte: feather the subject/background edge (guided-filter alpha) so hair
      # doesn't read as a cardboard cutout on any backdrop. =0 reverts to the hard binary edge.
      - TYPO_SOFT_MATTE=${TYPO_SOFT_MATTE:-1}
      # High-quality matting model (RobustVideoMatting) for true strand-level hair. OPT-IN:
      # set TYPO_MATTE_MODEL=1 in .env to enable (needs onnxruntime + the ~15MB model). Falls
      # back to the guided-filter soft matte when unset/unavailable. TYPO_MATTE_MAXSIDE caps res.
      - TYPO_MATTE_MODEL=${TYPO_MATTE_MODEL:-}
      - TYPO_MATTE_MAXSIDE=${TYPO_MATTE_MAXSIDE:-1280}
      # Matte edge cleanup: drop alpha below FLOOR to 0 (clean background gaps between
      # hair strands, no stray words) then GAMMA sharpens the low end. Matte-model path only.
      - TYPO_MATTE_FLOOR=${TYPO_MATTE_FLOOR:-0.12}
      - TYPO_MATTE_GAMMA=${TYPO_MATTE_GAMMA:-1.5}
      # Diagnostics: set TYPO_EYE_DEBUG=1 in .env to log per-face eye/lens detection to stderr.
      - TYPO_EYE_DEBUG=${TYPO_EYE_DEBUG:-}
      - TYPO_POLARITY_GAMMA=${TYPO_POLARITY_GAMMA:-1.35}
      - TYPO_POLARITY_FLOOR=${TYPO_POLARITY_FLOOR:-0.18}
      - TYPO_NOIR_CONTRAST=${TYPO_NOIR_CONTRAST:-1.08}
      # Iris colour fallback lift: brightens a low-saturation (brown) iris so it reads on the dark ground.
      - TYPO_IRIS_LIFT=${TYPO_IRIS_LIFT:-1.35}
      # De-posterize: add the photo's smooth light->dark falloff back so the face isn't flat/
      # banded (0..1; 0 disables). Default 0.6.
      - TYPO_DEPOSTERIZE=${TYPO_DEPOSTERIZE:-0.6}
      # Micro-expression: render facial creases (folds, crow's feet) as fine type (0..1; 0 off). Default 0.22.
      - TYPO_CREASE=${TYPO_CREASE:-0.22}
      # Highlights breathe: finer type in the brightest skin so highlights don't cake (0..1; 0 off). Default 0.30.
      - TYPO_HILIGHT_FINE=${TYPO_HILIGHT_FINE:-0.30}
      - TYPO_INK_SAT=${TYPO_INK_SAT:-1.02}
      - TYPO_RENDER_CONCURRENCY=${TYPO_RENDER_CONCURRENCY:-}
      - TYPO_RASTERIZER=${TYPO_RASTERIZER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TYPO_MODERATION_MODEL=${TYPO_MODERATION_MODEL:-omni-moderation-latest}
    volumes:
      - ./data/outputs:/app/outputs
      - ./data/private:/app/private
      - ./data:/app/data
      - ./static:/app/static:ro
