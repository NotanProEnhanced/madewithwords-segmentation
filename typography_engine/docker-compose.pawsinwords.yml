# PawsInWords.com — the pet typographic-portrait studio, as a COMPLETE standalone
# compose file (not an override), so it never inherits/merges prod's port and can't
# collide. Run it from a SEPARATE working tree checked out to this branch
# (e.g. ~/typortrait-pawsinwords), via the pawsinwords.sh helper:
#
#   ./pawsinwords.sh up -d --build     # build + start
#   ./pawsinwords.sh ps                # status
#   ./pawsinwords.sh logs -f           # tail logs
#   ./pawsinwords.sh down              # stop
#
# (pawsinwords.sh wraps: docker compose -f docker-compose.pawsinwords.yml -p typortrait-pawsinwords <args>)
#
# Isolation vs prod / staging / faithinwords / lovedinwords:
#   * image typortrait-pawsinwords:latest  -> never overwrites another image
#   * container typortrait-pawsinwords      -> no name clash
#   * port 127.0.0.1:8081                     -> prod 8077, staging 8078, faithinwords 8079, lovedinwords 8080
#   * bind-mounts resolve inside THIS tree    -> its OWN data / orders DB
#   * secrets come from THIS tree's .env (copy prod's .env, then apply the overrides)
# This is the PET brand: renders run through the landmark-free pet path (pet_proto),
# NOT the human face-mesh engine. The host/brand=pawsinwords selects the Paws in Words
# skin; nginx terminates TLS (cert for pawsinwords.com) and proxies here.
name: typortrait-pawsinwords
services:
  typortrait:
    build: .
    image: typortrait-pawsinwords:latest
    container_name: typortrait-pawsinwords
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8077"
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      # Pet digital download: $29 (recommended). Framed prints priced per-size in Printful.
      - TYPO_PRICE_CENTS=${TYPO_PRICE_CENTS:-2900}
      - TYPO_CURRENCY=${TYPO_CURRENCY:-usd}
      - TYPO_PUBLIC_URL=${TYPO_PUBLIC_URL:-https://pawsinwords.com}
      - TYPO_ADMIN_PASSWORD=${TYPO_ADMIN_PASSWORD:-}
      - TYPO_ADMIN_EMAIL=${TYPO_ADMIN_EMAIL:-}
      - TYPO_SECRET_KEY=${TYPO_SECRET_KEY:-}
      - TYPO_SMTP_HOST=${TYPO_SMTP_HOST:-smtp.gmail.com}
      - TYPO_SMTP_PORT=${TYPO_SMTP_PORT:-587}
      - TYPO_SMTP_USER=${TYPO_SMTP_USER:-}
      - TYPO_SMTP_PASS=${TYPO_SMTP_PASS:-}
      # Branded From display name on outgoing mail (buyer download emails, admin alerts).
      - TYPO_MAIL_FROM_NAME=${TYPO_MAIL_FROM_NAME:-Paws in Words}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - PRINTFUL_API_TOKEN=${PRINTFUL_API_TOKEN:-}
      - PRINTFUL_STORE_ID=${PRINTFUL_STORE_ID:-}
      - PRINTFUL_API_BASE=${PRINTFUL_API_BASE:-https://api.printful.com}
      - PRINT_URL_SECRET=${PRINT_URL_SECRET:-}
      # Starts as DRAFTS (safe). Set PRINTFUL_CONFIRM=true in .env to fulfil real prints.
      - PRINTFUL_CONFIRM=${PRINTFUL_CONFIRM:-false}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - UMAMI_HOST=${UMAMI_HOST:-https://cloud.umami.is}
      - UMAMI_HOSTNAME=${UMAMI_HOSTNAME:-pawsinwords.com}
      # Pets are not human biometric identifiers -> the BIPA face-region gate does not
      # apply here. Left unset (open); still overridable from .env if ever needed.
      - TYPO_BLOCKED_REGIONS=${TYPO_BLOCKED_REGIONS:-}
      - TYPO_GEO_COUNTRY_HEADER=${TYPO_GEO_COUNTRY_HEADER:-X-Geo-Country}
      - TYPO_GEO_REGION_HEADER=${TYPO_GEO_REGION_HEADER:-X-Geo-Region}
      - TYPO_BIO_CONSENT_VERSION=${TYPO_BIO_CONSENT_VERSION:-bio-v1-2026-06}
      # Studio only, no pre-made gallery storefront yet -> gallery OFF.
      - TYPO_GALLERY_ENABLED=${TYPO_GALLERY_ENABLED:-}
      - TYPO_GATHER_ENABLED=${TYPO_GATHER_ENABLED:-}
      # No EverLoved-style code redemption on the pet brand.
      - TYPO_REDEEM_ENABLED=${TYPO_REDEEM_ENABLED:-}
      - TYPO_REDEEM_BRAND=${TYPO_REDEEM_BRAND:-}
      - TYPO_WORD_VARIETY=${TYPO_WORD_VARIETY:-}
      - TYPO_RETENTION_DAYS=${TYPO_RETENTION_DAYS:-30}
      - TYPO_CONSENT_RETENTION_DAYS=${TYPO_CONSENT_RETENTION_DAYS:-}
      - TYPO_ENABLE_DEBUG=${TYPO_ENABLE_DEBUG:-}
      - TYPO_REQUIRE_CAIROSVG=${TYPO_REQUIRE_CAIROSVG:-}
      # Pet render prototype test page (/pet-test). Default OFF -> the route 404s.
      - PET_TEST=${PET_TEST:-}
      # Pet render knobs (live-tunable via .env, no rebuild).
      - PET_DRAPE=${PET_DRAPE:-}
      - PET_TYPE_SCALE=${PET_TYPE_SCALE:-}
      - PET_EDGE_INK=${PET_EDGE_INK:-}
      - PET_TONAL=${PET_TONAL:-}
      - PET_PHOTO=${PET_PHOTO:-}
      - PET_VIBRANCE=${PET_VIBRANCE:-}
      - PET_VIGNETTE=${PET_VIGNETTE:-}
      - PET_SHARPEN=${PET_SHARPEN:-}
      - PET_DRAPE_SMOOTH=${PET_DRAPE_SMOOTH:-}
      - PET_SHADOW_LIFT=${PET_SHADOW_LIFT:-}
      - PET_MATTE_MODEL=${PET_MATTE_MODEL:-}
      - PET_MATTE_FILL=${PET_MATTE_FILL:-}
      - PET_FEATURE_PROTECT=${PET_FEATURE_PROTECT:-}
      - PET_ROW_GAP=${PET_ROW_GAP:-}
      - PET_TRACK=${PET_TRACK:-}
      - PET_EYE_POP=${PET_EYE_POP:-}
      - PET_MAX_RENDER_PX=${PET_MAX_RENDER_PX:-}
      - PET_PHOTO_FUR=${PET_PHOTO_FUR:-}
      - PET_DEWHISKER=${PET_DEWHISKER:-}
      - PET_EDGE_TIGHTEN=${PET_EDGE_TIGHTEN:-}
      - PET_LOCAL_CONTRAST=${PET_LOCAL_CONTRAST:-}
      # Persist the matte model on the bind-mounted /app/data so it survives rebuilds.
      - PET_MATTE_DIR=/app/data/pet-models
      - TYPO_RENDER_CONCURRENCY=${TYPO_RENDER_CONCURRENCY:-}
      - TYPO_RASTERIZER=${TYPO_RASTERIZER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TYPO_MODERATION_MODEL=${TYPO_MODERATION_MODEL:-omni-moderation-latest}
    volumes:
      - ./data/outputs:/app/outputs
      - ./data/private:/app/private
      - ./data:/app/data
      - ./static:/app/static:ro
