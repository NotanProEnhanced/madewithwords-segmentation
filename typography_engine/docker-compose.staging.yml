# Staging override — runs the mirror alongside production on the same VPS, fully
# isolated. Use it together with the base compose file from a SEPARATE working
# tree checked out to the `staging` branch (e.g. ~/typortrait-staging), via the
# staging.sh helper:
#
#   ./staging.sh up -d --build      # build + start the staging container
#   ./staging.sh logs -f            # tail logs
#   ./staging.sh down               # stop
#
# (staging.sh just wraps:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml \
#                  -p typortrait-staging <args> )
#
# What this override changes vs production, and why it stays isolated:
#   • image:          typortrait-staging:latest  (never overwrites the prod image)
#   • container_name: typortrait-staging         (no name clash with prod)
#   • port:           127.0.0.1:8078             (prod is 8077)
#   • data:           the ./data, ./private, ./outputs bind-mounts resolve
#                     relative to THIS working tree, so staging's test data,
#                     orders DB and files are physically separate from prod's.
#   • secrets:        this tree's own .env (copy from .env.staging.example) holds
#                     Stripe TEST keys, PRINTFUL_CONFIRM=false, no Umami, and a
#                     distinct admin password / session secret.
services:
  typortrait:
    image: typortrait-staging:latest
    container_name: typortrait-staging
    ports:
      - "127.0.0.1:8078:8077"
