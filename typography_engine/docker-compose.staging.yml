# Staging mirror — a COMPLETE, standalone compose file (not an override), so it
# never inherits/merges prod's port and can't collide. Run it from a SEPARATE
# working tree checked out to the `staging` branch (e.g. ~/typortrait-staging),
# via the staging.sh helper:
#
#   ./staging.sh up -d --build      # build + start staging
#   ./staging.sh ps                 # status
#   ./staging.sh logs -f            # tail logs
#   ./staging.sh down               # stop
#
# (staging.sh wraps: docker compose -f docker-compose.staging.yml -p typortrait-staging <args>)
#
# Isolation vs production:
#   * image typortrait-staging:latest  -> never overwrites the prod image
#   * container typortrait-staging      -> no name clash
#   * port 127.0.0.1:8078               -> prod is 8077
#   * bind-mounts resolve inside THIS working tree -> separate data/orders/files
#   * secrets come from THIS tree's .env (copy from .env.staging.example):
#     Stripe TEST keys, PRINTFUL_CONFIRM=false, no Umami, distinct admin/secret.
# Explicit project name so staging is fully isolated from prod in Compose. Both
# trees are named typography_engine, so WITHOUT this they share a default project
# and a deploy in one tears down the other's container (Bad Gateway). Don't change.
name: typortrait-staging
services:
  typortrait:
    build: .
    image: typortrait-staging:latest
    container_name: typortrait-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8078:8077"
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - TYPO_PRICE_CENTS=${TYPO_PRICE_CENTS:-1499}
      - TYPO_CURRENCY=${TYPO_CURRENCY:-usd}
      - TYPO_PUBLIC_URL=${TYPO_PUBLIC_URL:-https://staging.typortrait.com}
      - TYPO_ADMIN_PASSWORD=${TYPO_ADMIN_PASSWORD:-}
      - TYPO_ADMIN_EMAIL=${TYPO_ADMIN_EMAIL:-}
      - TYPO_SECRET_KEY=${TYPO_SECRET_KEY:-}
      - TYPO_SMTP_HOST=${TYPO_SMTP_HOST:-smtp.gmail.com}
      - TYPO_SMTP_PORT=${TYPO_SMTP_PORT:-587}
      - TYPO_SMTP_USER=${TYPO_SMTP_USER:-}
      - TYPO_SMTP_PASS=${TYPO_SMTP_PASS:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - PRINTFUL_API_TOKEN=${PRINTFUL_API_TOKEN:-}
      - PRINTFUL_STORE_ID=${PRINTFUL_STORE_ID:-}
      - PRINTFUL_API_BASE=${PRINTFUL_API_BASE:-https://api.printful.com}
      - PRINT_URL_SECRET=${PRINT_URL_SECRET:-}
      # Staging default is DRAFTS (no charge/print). Keep this false.
      - PRINTFUL_CONFIRM=${PRINTFUL_CONFIRM:-false}
      # Analytics off on staging unless explicitly set (leave UMAMI_WEBSITE_ID blank).
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - UMAMI_HOST=${UMAMI_HOST:-https://cloud.umami.is}
      - UMAMI_HOSTNAME=${UMAMI_HOSTNAME:-staging.typortrait.com}
      # Privacy compliance + render-health knobs. Read in code with safe defaults;
      # listed here so they can be tuned from .env. See COMPLIANCE.md.
      - TYPO_BLOCKED_REGIONS=${TYPO_BLOCKED_REGIONS:-US-IL}
      - TYPO_GEO_COUNTRY_HEADER=${TYPO_GEO_COUNTRY_HEADER:-X-Geo-Country}
      - TYPO_GEO_REGION_HEADER=${TYPO_GEO_REGION_HEADER:-X-Geo-Region}
      - TYPO_BIO_CONSENT_VERSION=${TYPO_BIO_CONSENT_VERSION:-bio-v1-2026-06}
      # Gather (crowd-sourced words). Default OFF; set TYPO_GATHER_ENABLED=1 in
      # this tree's .env to turn the feature + its routes on (staging only).
      - TYPO_GATHER_ENABLED=${TYPO_GATHER_ENABLED:-}
      # Gallery storefront (pre-made collections: Sacred, Christmas). Default OFF;
      # set TYPO_GALLERY_ENABLED=1 in THIS tree's .env to expose /gallery on staging
      # only. Without this line the flag can never reach the app.
      - TYPO_GALLERY_ENABLED=${TYPO_GALLERY_ENABLED:-}
      # Word-variety dial for the Lifelike/Letter renderer. Unset = 0.0 = the original
      # engine, byte-identical. Set TYPO_WORD_VARIETY=0.7 in .env to flatten the lead-word
      # repetition so a varied word list reads as varied. Revert by deleting the line.
      - TYPO_WORD_VARIETY=${TYPO_WORD_VARIETY:-}
      # Auto-levels: recover FLAT / low-contrast uploads (per-channel black/white stretch
      # + median-normalising gamma; restores colour the internal luma stretch can't).
      # Default OFF (byte-identical); range-gated so good photos are untouched even when on.
      # Set TYPO_AUTOLEVELS=1 in THIS tree's .env to test on staging.
      - TYPO_AUTOLEVELS=${TYPO_AUTOLEVELS:-}
      # Redemption codes (gift/partner/pre-need: a code buys the personalize+fulfil flow
      # with NO Stripe charge). Default OFF -- every /redeem route 404s until
      # TYPO_REDEEM_ENABLED=1 is set in THIS tree's .env, so it deploys INERT on staging
      # and is switched on deliberately for testing. TYPO_REDEEM_BRAND picks the studio skin.
      - TYPO_REDEEM_ENABLED=${TYPO_REDEEM_ENABLED:-}
      - TYPO_REDEEM_BRAND=${TYPO_REDEEM_BRAND:-}
      - TYPO_RETENTION_DAYS=${TYPO_RETENTION_DAYS:-30}
      - TYPO_CONSENT_RETENTION_DAYS=${TYPO_CONSENT_RETENTION_DAYS:-}
      - TYPO_ENABLE_DEBUG=${TYPO_ENABLE_DEBUG:-}
      - TYPO_REQUIRE_CAIROSVG=${TYPO_REQUIRE_CAIROSVG:-}
      # Background lightening: render the image background lighter than the subject's
      # dark ground (0..1, fraction toward white; 0 = off, background == ground).
      - TYPO_BG_LIGHTEN=${TYPO_BG_LIGHTEN:-0}
      # Highlight wash: keep bright features (silver hair, pale skin) light on the dark
      # ground so they don't collapse to the ground (0..1; 0 disables). Default 0.5.
      - TYPO_HILIGHT_WASH=${TYPO_HILIGHT_WASH:-0.5}
      - TYPO_RENDER_CONCURRENCY=${TYPO_RENDER_CONCURRENCY:-}
      # SVG->PNG backend: auto (CairoSVG, full fidelity, slower) | resvg (much
      # faster; identical output for the current solid-fill SVGs) | cairosvg.
      - TYPO_RASTERIZER=${TYPO_RASTERIZER:-auto}
      # Text moderation (OpenAI moderation endpoint). Unset -> text moderation off.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TYPO_MODERATION_MODEL=${TYPO_MODERATION_MODEL:-omni-moderation-latest}
    volumes:
      - ./data/outputs:/app/outputs
      - ./data/private:/app/private
      - ./data:/app/data
      - ./static:/app/static:ro
